[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "insightapi"
version = "2.0.0"
description = "InsightAPI AI — Agentic AI API Intelligence Platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "rich>=13.7.0",
    "langgraph>=0.1.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-google-genai>=2.0.0",
    "google-genai>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "redis[hiredis]>=5.0.0",
    "pydantic>=2.7.0",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3.0",
    "pyjwt>=2.8.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "alembic>=1.13.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.4.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0"
]
# Browser automation backend
browser = [
    "playwright>=1.44.0",
]
# Semantic / vector memory backend
memory = [
    "chromadb>=0.5.0",
]
# Background task worker
worker = [
    "celery[redis]>=5.4.0",
]
# Full optional stack (all of the above)
full = [
    "playwright>=1.44.0",
    "chromadb>=0.5.0",
    "celery[redis]>=5.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
