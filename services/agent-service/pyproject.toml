[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "insightapi"
version = "1.0.0"
description = "Agentic Web API Intelligence Platform"
authors = [{ name = "InsightAPI AI Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "langgraph>=0.1.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "playwright>=1.45.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "redis[hiredis]>=5.0.0",
    "pydantic>=2.7.0",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.4.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0"
]
extensions = [
    "playwright-stealth>=1.0.6",
    "fake-useragent>=1.5.0",
    "chromadb>=0.5.0",
    "schemathesis>=3.30.0",
    "mitmproxy>=10.3.0"
]


[project.scripts]
insightapi = "app.cli.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.package-dir]
insightapi = "app"

