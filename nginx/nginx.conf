upstream bff {
    server client:3000;
}

upstream gateway {
    server gateway:8080;
}

# Sanitize access tokens from logs if ever present in query params
map $request_uri $sanitized_request_uri {
    ~^(?<path>[^?]+)\?(?<prefix>.*)token=[^&]+(?<suffix>.*)$  $path?${prefix}token=[REDACTED]${suffix};
    default                                                  $request_uri;
}

log_format sanitized '$remote_addr - $remote_user [$time_local] "$request_method $sanitized_request_uri $server_protocol" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log sanitized;

    # Client-side max body (for file uploads etc.)
    client_max_body_size 20M;

    # ── BFF / Next.js (landing, dashboard, docs, auth pages) ──────────────
    location / {
        proxy_pass http://bff;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API Gateway (all /api/* REST and Auth calls) ──────────────────────
    location /api/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── WebSocket Connections (crawl streaming + chatbot) ─────────────────
    location /ws/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;   # Keep WS alive for long crawl sessions
        proxy_send_timeout 3600s;
    }

    # ── Next.js Static Assets ─────────────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://bff;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
