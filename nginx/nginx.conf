upstream bff {
    server client:3000;
}

upstream gateway {
    server gateway:8080;
}

server {
    listen 80;
    server_name _;

    # Client-side max body (for file uploads etc.)
    client_max_body_size 20M;

    # ── BFF / Next.js (landing, dashboard, docs, auth pages) ──────────────
    location / {
        proxy_pass http://bff;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── BFF API Routes (auth token exchange, SSR data) ────────────────────
    location /api/auth/ {
        proxy_pass http://bff;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── API Gateway (all other /api/* REST calls) ─────────────────────────
    location /api/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── WebSocket Connections (crawl streaming + chatbot) ─────────────────
    location /ws/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;   # Keep WS alive for long crawl sessions
        proxy_send_timeout 3600s;
    }

    # ── Next.js Static Assets ─────────────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://bff;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
