# =============================================================================
# InsightAPI Enterprise On-Premises & Customer VPC Docker Compose Blueprint
#
# Optimized for:
#  - Customer-managed external PostgreSQL (RDS/CloudSQL/Self-hosted)
#  - Customer-managed external Redis (ElastiCache/MemoryDB/Self-hosted)
#  - Air-gapped single-tenant network isolation
#  - Local LLM inference backend (Ollama / vLLM / OpenAI-compatible endpoint)
# =============================================================================

version: '3.8'

services:
  # ── Enterprise Reverse Proxy / Load Balancer ────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: insightapi_enterprise_nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - client
      - gateway
    networks:
      - enterprise_vpc_net

  # ── Next.js Enterprise Frontend (BFF) ───────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: insightapi_enterprise_client
    restart: always
    env_file: [.env]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_ENV: enterprise
    expose:
      - "3000"
    depends_on:
      - gateway
    networks:
      - enterprise_vpc_net

  # ── API Gateway Service ─────────────────────────────────────────────────────
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: insightapi_enterprise_gateway
    restart: always
    env_file: [.env]
    environment:
      REDIS_HOST: ${EXTERNAL_REDIS_HOST:-redis}
      REDIS_PORT: ${EXTERNAL_REDIS_PORT:-6379}
      REDIS_PASSWORD: ${EXTERNAL_REDIS_PASSWORD:-}
    expose:
      - "8080"
    networks:
      - enterprise_vpc_net

  # ── Core Service (Auth, Audit, API Keys) ───────────────────────────────────
  core-service:
    build:
      context: ./services/core-service
      dockerfile: Dockerfile
    container_name: insightapi_enterprise_core
    restart: always
    env_file: [.env]
    environment:
      POSTGRES_HOST: ${EXTERNAL_POSTGRES_HOST:-db}
      POSTGRES_PORT: ${EXTERNAL_POSTGRES_PORT:-5432}
      POSTGRES_USER: ${EXTERNAL_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${EXTERNAL_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${EXTERNAL_POSTGRES_DB:-insightapi}
      REDIS_HOST: ${EXTERNAL_REDIS_HOST:-redis}
      REDIS_PORT: ${EXTERNAL_REDIS_PORT:-6379}
      REDIS_PASSWORD: ${EXTERNAL_REDIS_PASSWORD:-}
    expose:
      - "8001"
    networks:
      - enterprise_vpc_net

  # ── Autonomous Agent Service (Engine + Test Generator) ─────────────────────
  agent-service:
    build:
      context: ./services/agent-service
      dockerfile: Dockerfile
    container_name: insightapi_enterprise_agent
    restart: always
    env_file: [.env]
    environment:
      POSTGRES_HOST: ${EXTERNAL_POSTGRES_HOST:-db}
      POSTGRES_PORT: ${EXTERNAL_POSTGRES_PORT:-5432}
      POSTGRES_USER: ${EXTERNAL_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${EXTERNAL_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${EXTERNAL_POSTGRES_DB:-insightapi}
      REDIS_HOST: ${EXTERNAL_REDIS_HOST:-redis}
      REDIS_PORT: ${EXTERNAL_REDIS_PORT:-6379}
      REDIS_PASSWORD: ${EXTERNAL_REDIS_PASSWORD:-}
      # Local/Private LLM Endpoint Option (e.g. http://ollama:11434/v1 or private vLLM)
      OPENAI_BASE_URL: ${ENTERPRISE_LLM_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${ENTERPRISE_LLM_API_KEY:-}
    expose:
      - "8002"
    volumes:
      - ./logs:/app/logs
      - ./reports:/app/reports
    networks:
      - enterprise_vpc_net

  # ── Optional Local PostgreSQL (Used only when external DB is not provided) ──
  db:
    image: pgvector/pgvector:pg16
    container_name: insightapi_enterprise_db
    restart: always
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-insightapi}
    volumes:
      - postgres_enterprise_data:/var/lib/postgresql/data
    networks:
      - enterprise_vpc_net

  # ── Optional Local Redis (Used only when external Redis is not provided) ────
  redis:
    image: redis:7-alpine
    container_name: insightapi_enterprise_redis
    restart: always
    profiles: ["local-redis"]
    volumes:
      - redis_enterprise_data:/data
    networks:
      - enterprise_vpc_net

networks:
  enterprise_vpc_net:
    driver: bridge
    internal: false

volumes:
  postgres_enterprise_data:
  redis_enterprise_data:
