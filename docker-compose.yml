services:
  # ── NGINX Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: insightapi_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - gateway

  # ── ngrok Tunnel Service ──────────────────────────────────────────────────
  ngrok:
    image: ngrok/ngrok:latest
    container_name: insightapi_ngrok
    restart: always
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "--url=${NGROK_DOMAIN:-native-hurt-progeny.ngrok-free.dev}"
      - "nginx:80"
    depends_on:
      - nginx

  # ── Next.js Client (BFF + Frontend) ──────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: insightapi_client
    restart: always
    env_file: [.env]
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      - gateway

  # ── API Gateway ───────────────────────────────────────────────────────────
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: insightapi_gateway
    restart: always
    env_file: [.env]
    expose:
      - "8080"
    depends_on:
      redis:
        condition: service_healthy

  # ── Core Service (Auth + Payments) ───────────────────────────────────────
  core-service:
    build:
      context: ./services/core-service
      dockerfile: Dockerfile
    container_name: insightapi_core
    restart: always
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    expose:
      - "8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Agent Service (Crawl Engine + Chatbot) ────────────────────────────────
  agent-service:
    build:
      context: ./services/agent-service
      dockerfile: Dockerfile
    container_name: insightapi_agent
    restart: always
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    expose:
      - "8002"
    volumes:
      - ./logs:/app/logs
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Crawl Worker (scales independently of the API) ────────────────
  agent-worker:
    build:
      context: ./services/agent-service
      dockerfile: Dockerfile
    restart: always
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      C_FORCE_ROOT: "true"
    command: >
      celery -A app.core.celery_app worker
      --loglevel=info
      --concurrency=2
      --queues=crawls
      --hostname=worker@%h
    volumes:
      - ./logs:/app/logs
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── PostgreSQL + pgvector ─────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: insightapi_db
    restart: always
    env_file: [.env]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-insightapi}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-insightapi}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: insightapi_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
